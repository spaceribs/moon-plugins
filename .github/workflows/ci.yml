name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  # Avoids GitHub rate limits when plugins resolve versions from git tags.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ci:
    name: Checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The extension's image builds use `sh`; Windows isn't supported yet.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-rust@v1
        with:
          cache: false
          components: clippy, rustfmt, llvm-tools
          targets: wasm32-wasip1
      # `psm` (via `pest`, used by moon's config and Tera) ships a precompiled
      # wasm object that `cc` archives with `ar`. Apple's `ar` can't index wasm
      # objects, so linking fails with `undefined symbol: rust_psm_stack_pointer`.
      # Use rustup's llvm-ar for wasm targets instead.
      - if: runner.os == 'macOS'
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "AR_wasm32_wasip1=$(rustc --print sysroot)/lib/rustlib/$host/bin/llvm-ar" >> "$GITHUB_ENV"
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # Pull requests run what their changes affect. main, and pull requests
      # that change CI itself (which no moon task takes as an input), run
      # everything, so they never pass by testing nothing.
      - name: Run checks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && git diff --quiet \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- .github/; then
            moon ci --color
          else
            moon run :lint :test root:format root:openspec --color
          fi

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Conventional Commits drive release-plz's versions and changelogs.
      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # New branch: nothing to compare against.
            exit 0
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          sh scripts/commit-lint.sh --range "$range"
