id: "root"

# Don't inherit the per-crate Rust tasks at the workspace root.
workspace:
  inheritedTasks:
    include: []

tasks:
  format:
    command: "cargo fmt --all --check"
    inputs:
      - "**/*.rs"

  format-write:
    command: "cargo fmt --all"
    preset: "utility"

  # OpenSpec: validate specs and change proposals (see openspec/).
  openspec:
    command: "openspec validate --all --strict --no-interactive"
    inputs:
      - "openspec/**/*"

  # Regenerate OpenSpec's AI instruction files (.claude/) after upgrading it
  # in .prototools.
  openspec-update:
    command: "openspec update"
    preset: "utility"
