name: Release

# Push a tag named `<crate>-v<version>` (e.g. `tilt_extension-v0.1.0`) to
# build, optimize, and attach that plugin's .wasm to a GitHub release.
on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"
  pull_request:

permissions:
  contents: write
  # Publishing to ghcr.io (enables `registry://` locators)
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          cache: false
          targets: wasm32-wasip1
      - id: build
        uses: moonrepo/build-wasm-plugin@v0
        with:
          publish: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: builds/*
          artifactErrorsFailBuild: true
          body: ${{ steps.build.outputs.changelog-entry }}
          makeLatest: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          skipIfReleaseExists: true
