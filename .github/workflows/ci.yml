name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  # Avoids GitHub rate limits when plugins resolve versions from git tags.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ci:
    name: Checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The extension's image builds use `sh`; Windows isn't supported yet.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-rust@v1
        with:
          cache: false
          components: clippy, rustfmt
          targets: wasm32-wasip1
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: moon ci --color
