[workspace]
resolver = "3"
members = ["extensions/*", "toolchains/*", "tools/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/spaceribs/moon-plugins"

[workspace.dependencies]
extism-pdk = "1.4.1"
moon_common = "2.1.0"
moon_config = "2.2.2"
moon_pdk = "2.3.0"
moon_pdk_api = "2.3.0"
moon_pdk_test_utils = "2.3.0"
proto_pdk = "0.35.4"
proto_pdk_api = "0.34.5"
proto_pdk_test_utils = "0.50.1"
schematic = { version = "0.20.6", default-features = false, features = ["schema"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_norway = "0.9.42"
tera = { version = "1.20.1", default-features = false }
starbase_sandbox = "0.12.0"
starbase_utils = { version = "0.14.6", default-features = false }
tokio = { version = "1.53.1", features = ["full"] }

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = "s"
panic = "abort"
