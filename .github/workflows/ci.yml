name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  # Avoids GitHub rate limits when plugins resolve versions from git tags.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ci:
    name: Checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The extension's image builds use `sh`; Windows isn't supported yet.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-rust@v1
        with:
          cache: false
          components: clippy, rustfmt
          targets: wasm32-wasip1
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # Pull requests run what their changes affect. main runs everything, so
      # it never passes by testing nothing (e.g. a first push has no base).
      - if: github.event_name == 'pull_request'
        run: moon ci --color
      - if: github.event_name == 'push'
        run: moon run :lint :test root:format root:openspec --color

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Conventional Commits drive release-plz's versions and changelogs.
      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # New branch: nothing to compare against.
            exit 0
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          sh scripts/commit-lint.sh --range "$range"
