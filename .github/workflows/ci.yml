name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  # Avoids GitHub rate limits when plugins resolve versions from git tags.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ci:
    name: Checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-rust@v1
        with:
          cache: false
          components: clippy, rustfmt, llvm-tools
          targets: wasm32-wasip1
      # `psm` (via `pest`, used by moon's config and Tera) ships a precompiled
      # wasm object that `cc` archives with `ar`. Apple's `ar` can't index wasm
      # objects (linking fails with `undefined symbol: rust_psm_stack_pointer`),
      # and Windows has no `ar`. Use rustup's llvm-ar for wasm targets instead.
      - if: runner.os != 'Linux'
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          ext=$([ "$RUNNER_OS" = "Windows" ] && echo ".exe" || true)
          echo "AR_wasm32_wasip1=$(rustc --print sysroot)/lib/rustlib/$host/bin/llvm-ar$ext" >> "$GITHUB_ENV"
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # Pull requests run what their changes affect. main, and pull requests
      # that change CI itself (which no moon task takes as an input), run
      # everything, so they never pass by testing nothing.
      - name: Run checks
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && git diff --quiet \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- .github/; then
            moon ci --color
          else
            moon run :lint :test root:format root:openspec --color
          fi
      # Real moon and Tilt on examples/tilt-demo: web's resources come up, and
      # file edits re-run only what's affected (see the script).
      - name: End-to-end
        shell: bash
        run: bash scripts/e2e-tilt.sh

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Conventional Commits drive release-plz's versions and changelogs.
      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # New branch: nothing to compare against.
            exit 0
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          sh scripts/commit-lint.sh --range "$range"
