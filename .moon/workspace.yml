$schema: "./cache/schemas/workspace.json"

projects:
  root: "."
  # Extensions (moon)
  tilt-extension: "extensions/tilt"
  # Toolchains (moon)
  tilt-toolchain: "toolchains/tilt"
  # Tools (proto)
  tilt-tool: "tools/tilt"

vcs:
  client: "git"
  defaultBranch: "main"
  # Commit messages must follow Conventional Commits, which release-plz uses to
  # version the plugins. moon installs the hook whenever it runs a task.
  hooks:
    commit-msg:
      - "sh scripts/commit-lint.sh $ARG1"
  sync: true

pipeline:
  logRunningCommand: true
